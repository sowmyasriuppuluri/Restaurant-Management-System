<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Order Success</title>

<style>
body{
    font-family: Arial;
    background:#f5e6d3;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    margin:0;
}

/* Main box */
.box{
    background:white;
    padding:40px 30px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
    width:320px;
}

/* Green circle */
.circle{
    width:90px;
    height:90px;
    background:#28a745;
    border-radius:50%;
    margin:0 auto 15px auto;
    display:flex;
    justify-content:center;
    align-items:center;
    animation: pop 0.4s ease-in-out;
}

/* Tick mark */
.circle span{
    font-size:50px;
    color:white;
    font-weight:bold;
}

/* Heading */
h1{
    color:#28a745;
    font-size:22px;
    margin:10px 0;
}

/* Text */
p{
    color:#444;
    margin:5px 0;
}

/* Button */
button{
    margin-top:20px;
    padding:10px 15px;
    background:#8b2d14;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

/* simple animation */
@keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.1); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="box">

    <!-- Green tick circle -->
    <div class="circle">
        <span>✓</span>
    </div>

    <h1>Order Completed Successfully</h1>
    <p>Thank you for your order 🍽️</p>
    <p>Please visit again 😊</p>

</div>

</body>
</html>
